name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pypdf==6.12.2

      - name: Run full tests including PDF and Schematron
        env:
          ERECHNUNG_REQUIRE_INTEGRATION: "1"
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff==0.15.16
          ruff check --output-format=github .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: mypy
        # ignore_missing_imports (mypy.ini) -> Dritt-Libs müssen nicht installiert sein.
        run: |
          pip install mypy==2.1.0
          mypy app.py zugferd.py i18n.py countries.py desktop.py scripts/check_macos_release.py

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Syntax-Check
        run: node --check static/calc.js && node --check static/app.js
      - name: JS-Tests (Rechenlogik)
        run: node --test tests/calc.test.js

  macos-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native and Python dependencies
        run: |
          brew install pango
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-build.txt pypdf==6.12.2
      - name: Build Apple Silicon app
        run: ./build_macos.sh
