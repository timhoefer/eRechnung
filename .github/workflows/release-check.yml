name: Release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag des vorhandenen Entwurfs (z. B. v1.1.2)"
        required: true
        type: string
      publish:
        description: "Nach erfolgreicher Prüfung veröffentlichen"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      # GitHub exposes draft releases only to tokens with push access.
      contents: write
    outputs:
      digests: ${{ steps.archive.outputs.digests }}
      dmg: ${{ steps.source.outputs.dmg }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release tag, source version and changelog
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import ast, json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Expected release tag vX.Y.Z')
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--json', 'tagName,targetCommitish']))
          if release['tagName'] != tag:
              raise SystemExit('Release tag mismatch')
          tagged = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}'],
                                  capture_output=True, text=True)
          ref = tagged.stdout.strip() if tagged.returncode == 0 else release['targetCommitish']
          source = subprocess.check_output(['git', 'show', f'{ref}:version.py'], text=True)
          version = next(ast.literal_eval(node.value) for node in ast.parse(source).body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets))
          if tag != f'v{version}':
              raise SystemExit('Source version does not match release tag')
          changelog = subprocess.check_output(['git', 'show', f'{ref}:CHANGELOG.md'], text=True)
          if f'## {version}' not in changelog.splitlines():
              raise SystemExit('Version missing from changelog')
          # Older releases shipped only a ZIP. New sources require both downloads.
          has_dmg = subprocess.run(['git', 'cat-file', '-e', f'{ref}:scripts/build_dmg.py'],
                                   capture_output=True).returncode == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'dmg={str(has_dmg).lower()}', file=output)
          PY
      - name: Download and verify the actual release files
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          HAS_DMG: ${{ steps.source.outputs.dmg }}
        run: |
          gh release download "$RELEASE_TAG" --pattern eRechnung.app.zip --dir release-download
          EXTRA_ARGS=()
          if [ "$HAS_DMG" = "true" ]; then
            gh release download "$RELEASE_TAG" --pattern eRechnung.dmg --dir release-download
            EXTRA_ARGS=(--dmg release-download/eRechnung.dmg)
          fi
          unset GH_TOKEN
          python scripts/check_macos_release.py --version "${RELEASE_TAG#v}" --archive release-download/eRechnung.app.zip "${EXTRA_ARGS[@]}"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          digests = {}
          for path in Path('release-download').iterdir():
              with path.open('rb') as asset:
                  digests[path.name] = 'sha256:' + hashlib.file_digest(asset, 'sha256').hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('digests=' + json.dumps(digests), file=output)
          PY

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure both checked downloads are unchanged and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_DIGESTS: ${{ needs.verify.outputs.digests }}
          HAS_DMG: ${{ needs.verify.outputs.dmg }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          tag = os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'assets']))
          expected = json.loads(os.environ['EXPECTED_DIGESTS'])
          required = {'eRechnung.app.zip'}
          if os.environ['HAS_DMG'] == 'true':
              required.add('eRechnung.dmg')
          if set(expected) != required:
              raise SystemExit('Missing verification result for a release download')
          for name, digest in expected.items():
              assets = [a for a in release['assets'] if a['name'] == name]
              if len(assets) != 1 or assets[0].get('digest') != digest:
                  raise SystemExit(f'Release download changed after verification: {name}')
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest'], check=True)
          PY
