{% if whats_new %}
<dialog id="whats-new-dialog" class="whats-new" aria-labelledby="whats-new-title"
        data-announcement-id="{{ whats_new.id }}" data-seen="{{ 'true' if whats_new.seen else 'false' }}"
        data-auto-open="{{ 'true' if show_whats_new and whats_new.auto_open and not whats_new.seen else 'false' }}"
        data-seen-url="{{ url_for('whats_new_seen') }}">
  <h2 id="whats-new-title">{{ t.whats_new_title }}</h2>
  <p class="whats-new-version">{{ t.whats_new_version }} {{ whats_new.version }}</p>
  <ul class="whats-new-features">
    {% for feature in whats_new['items'] %}
    <li>
      <svg class="whats-new-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        {% if feature.icon == 'globe' %}
        <circle cx="16" cy="16" r="12"></circle><ellipse cx="16" cy="16" rx="5" ry="12"></ellipse>
        <path d="M4 16h24M7 8.5h18M7 23.5h18"></path>
        {% elif feature.icon == 'archive' %}
        <rect x="4" y="5" width="24" height="6" rx="1.5"></rect>
        <path d="M6 11v15a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V11M12 16h8M12 21h5"></path>
        {% else %}
        <path d="M19 3H8a2 2 0 0 0-2 2v22a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V10ZM19 3v7h7M11 15h10M11 20h10M16 25h5"></path>
        {% endif %}
      </svg>
      <div><h3>{{ feature.title }}</h3><p>{{ feature.text }}</p></div>
    </li>
    {% endfor %}
  </ul>
  <form method="dialog" class="whats-new-actions">
    <button type="submit" autofocus>{{ t.whats_new_continue }}</button>
  </form>
</dialog>
<script src="{{ url_for('static', filename='whats_new.js') }}?v={{ asset_version('whats_new.js') }}" defer></script>
{% endif %}
